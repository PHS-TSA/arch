---
name: CI/CD

on:
  push:
    branches:
      - main
      - merge
  pull_request:
  merge_group:
  schedule:
    - cron: "0 14 * * 1" # Every Monday at 9 A.M. CST.
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build
    timeout-minutes: ${{ (matrix.target == 'web') && 5 || 10 }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        target:
          - web
          # - macos
        include:
          - target: web
            os: ubuntu-latest
            godot-flags: --export-release "Web" build/index.html
          # - target: macos
          #   os: macos-latest
          #   godot-flags: --export-release "OS X"

    permissions:
      contents: read # Needed to download the repository.

    steps:
      - name: 📚 Git checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          clean: true
          persist-credentials: false
          set-safe-directory: true
          fetch-depth: 1
      - name: 🤖 Set up Godot
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789 # v2.4.1
        with:
          version: 4.6.1
          use-dotnet: false
          include-templates: true
      - name: Install Blender
        run: sudo apt install blender
      - name: Configure Blender path for Godot
        shell: bash
        run: |
          set -euo pipefail
          BLENDER_BIN="$(command -v blender)"
          mkdir -p "$HOME/.config/godot"

          for SETTINGS_FILE in \
            "$HOME/.config/godot/editor_settings-4.6.tres" \
            "$HOME/.config/godot/editor_settings-4.tres"; do
            if [[ ! -f "$SETTINGS_FILE" ]]; then
              {
                printf '%s\n' '[gd_resource type="EditorSettings" format=3]'
                printf '\n[resource]\n'
                printf 'filesystem/import/blender/blender_path = "%s"\n' "$BLENDER_BIN"
                printf 'filesystem/import/blender/rpc_port = 0\n'
              } > "$SETTINGS_FILE"
            elif grep -q '^filesystem/import/blender/blender_path' "$SETTINGS_FILE"; then
              sed -i "s|^filesystem/import/blender/blender_path.*|filesystem/import/blender/blender_path = \"$BLENDER_BIN\"|" "$SETTINGS_FILE"
            else
              printf '\nfilesystem/import/blender/blender_path = "%s"\nfilesystem/import/blender/rpc_port = 0\n' "$BLENDER_BIN" >> "$SETTINGS_FILE"
            fi
          done

          echo "Configured blender path: $BLENDER_BIN"
      - name: 🔬 Verify setup
        run: godot --version
      - name: 🔌 Make and delete directories
        run: mkdir build/ && rm -rf addons/{godot-git-plugin} && sed -i '/version_control\/plugin_name=/d;/version_control\/autoload_on_startup=/d' project.godot
      - name: 🔧 Build
        run: godot --headless ${{ matrix.godot-flags }}
      - name: ⚙️ Upload build
        if: matrix.target == 'web'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: build-${{ matrix.target }}
          path: "./build"
          if-no-files-found: error

  deploy:
    name: Deploy to Deno Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      id-token: write # Needed to authenticate with Deno Deploy.
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: true

    environment:
      name: production
      url: https://wild-west-windfall.phs-tsa-ea.deno.net/

    steps:
      - name: 📚 Git checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          clean: true
          persist-credentials: false
          set-safe-directory: true
          fetch-depth: 1
          sparse-checkout: server
      - name: 🦕 Install Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.7.9
      - name: ⚙️ Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-web
          path: "./build"
      - name: 🔧 Deploy
        run: deno deploy --org phs-tsa-ea --app wild-west-windfall --prod
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
